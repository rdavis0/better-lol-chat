<div id="blc-update-dialog" class="blc-dialog" role="dialog" aria-modal="true" aria-labelledby="blc-dialog-title" hidden>
  <lol-uikit-dialog-frame class="dialog-frame" orientation="bottom" close-button>
    <div class="dialog-content">
      <lol-uikit-content-block class="blc-dialog-block" type="dialog-small">
        <h4 id="blc-dialog-title" data-blc-text="title">BETTER LOL CHAT UPDATE AVAILABLE</h4>
        <hr class="heading-spacer">

        <div class="blc-dialog-view" data-blc-view="notes">
          <p class="blc-dialog-sub" data-blc-text="subtitle"></p>
          <lol-uikit-scrollable class="blc-dialog-notes" overflow-masks="enabled">
            <div class="blc-dialog-notes-text" data-blc-text="notes"></div>
          </lol-uikit-scrollable>
          <button type="button" class="blc-dialog-link blc-dialog-skip" data-blc-action="skip">Skip this update</button>
        </div>

        <div class="blc-dialog-view" data-blc-view="done" hidden>
          <p>Download initiated. Open the install.bat file to install. Then press Ctrl + R in the client to load changes.</p>
          <p class="blc-dialog-fallback">
            Download didn't start?
            <button type="button" class="blc-dialog-link" data-blc-action="release">Click here to open the release page</button>
          </p>
        </div>
      </lol-uikit-content-block>
    </div>

    <lol-uikit-flat-button-group type="dialog-frame" data-blc-view="notes">
      <lol-uikit-flat-button class="button-accept" data-blc-action="download">DOWNLOAD NOW</lol-uikit-flat-button>
      <lol-uikit-flat-button class="button-decline" data-blc-action="release">VIEW ON GITHUB</lol-uikit-flat-button>
    </lol-uikit-flat-button-group>
  </lol-uikit-dialog-frame>
</div>
